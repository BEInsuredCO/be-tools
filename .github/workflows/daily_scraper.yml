name: Hourly Performology Data Pull

on:
  schedule:
    # Every hour 7am-7pm MDT (MDT = UTC-6), Mon-Fri
    # 7am MDT  = 13:00 UTC
    # 8am MDT  = 14:00 UTC
    # 9am MDT  = 15:00 UTC
    # 10am MDT = 16:00 UTC
    # 11am MDT = 17:00 UTC
    # 12pm MDT = 18:00 UTC
    # 1pm MDT  = 19:00 UTC
    # 2pm MDT  = 20:00 UTC
    # 3pm MDT  = 21:00 UTC
    # 4pm MDT  = 22:00 UTC
    # 5pm MDT  = 23:00 UTC
    # 6pm MDT  = 00:00 UTC (next day)
    # 7pm MDT  = 01:00 UTC (next day)
    - cron: '0 13-23 * * 1-5'
    - cron: '0 0,1 * * 2-6'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: Run Performology scraper
        env:
          PERFORMOLOGY_EMAIL: ${{ secrets.PERFORMOLOGY_EMAIL }}
          PERFORMOLOGY_PASSWORD: ${{ secrets.PERFORMOLOGY_PASSWORD }}
        run: python scraper.py

      - name: Commit and push data.json
        run: |
          git config user.name "BE Tools Bot"
          git config user.email "betools@beinsuredco.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Auto-update: Performology data $(date '+%Y-%m-%d %H:%M')"
          git push
